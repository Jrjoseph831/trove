name: Deploy to GitHub Pages

# NOT triggered by pushes any more. Company sites live at /<handle>, which is a
# dynamic route — a player publishes a site and a new URL exists. That needs
# `dynamicParams: true`, and Next refuses to combine it with `output: export`:
#
#   Error: "dynamicParams: true" cannot be used with "output: export"
#
# So a static export can no longer represent this app, and leaving the push
# trigger on would mean a permanently red build on every merge to main. Vercel
# serves production (trove.ceo) and handles the dynamic routes properly.
#
# Left dispatchable rather than deleted, and the existing Pages site keeps
# serving whatever it last published — nothing goes down by turning this off.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Verify — typecheck + economy invariant tests
        run: |
          npm run -w @trove/data typecheck
          npm run -w @trove/engine typecheck
          npm run -w @trove/engine test
          npm run -w @trove/server typecheck
      - name: Build static export
        run: npm run build -w @trove/web
        env:
          PAGES: "true"
      - name: Disable Jekyll (serve _next/)
        run: touch apps/web/out/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
